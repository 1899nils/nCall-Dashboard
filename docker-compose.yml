services:
  ncall-dashboard:
    build: .
    image: ncall-dashboard:latest
    ports:
      - "8080:8080"
    environment:
      TZ: "Europe/Berlin"

      # Dashboard login. Creates one admin account on first start (only if
      # no login accounts exist yet); further users can be added from the
      # Einstellungen tab afterwards. Change/remove ADMIN_PASSWORD once the
      # account exists so it isn't sitting in your container config.
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-me"

      # COMtrexx connection — set COMTREXX_MOCK=false once ready to go live
      # (see README "COMtrexx-Anbindung einrichten"). base_url must include
      # the API version path.
      COMTREXX_MOCK: "true"
      COMTREXX_BASE_URL: "https://192.168.0.10/api/v1"
      COMTREXX_USERNAME: ""
      COMTREXX_PASSWORD: ""
      COMTREXX_VERIFY_SSL: "true"

      # Daily sync at 00:15
      SYNC_CRON: "15 0 * * *"
      SYNC_LOOKBACK_DAYS: "2"

      # Optional: seed the extension→Standort mapping on first start, e.g.
      # '[{"range_start":800,"range_end":899,"site":"Standort Nord"}]'
      SITE_MAPPING_SEED: "[]"
    volumes:
      - ncall_data:/data
    restart: unless-stopped

volumes:
  ncall_data:
